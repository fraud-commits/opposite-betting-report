<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opposite Betting Report</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css?v=29">
</head>

<body class="is-loading">

<!-- Popup: Player List -->
<div id="popupOverlay" class="lfs-overlay hidden"></div>
<div id="popupContent" class="lfs-popup-wrap hidden">
  <div class="lfs-popup">
    <h2 id="popupTitle" class="lfs-popup-title"></h2>
    <p id="popupDesc" class="lfs-popup-desc"></p>
    <button id="copyButton" class="lfs-btn">
      <svg fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
      </svg>
      Copy Formated Player List
    </button>
    <div class="player-list">
      <table id="myTable" class="table table-striped" style="width:100%">
        <thead><tr><th>Unique Player ID</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Top bar -->
<header class="lfs-topbar">
  <div class="lfs-topbar-left">
    <svg class="lfs-back" fill="none" viewBox="0 0 34 24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M27 8H13 M19 3l-7 5 7 5" stroke="#00F4BB"></path>
      <path d="M7 16h14 M15 11l7 5-7 5" stroke="#fff" opacity=".95"></path>
    </svg>
    <span class="lfs-title">OPPOSITE BETTING</span>
  </div>
  <div class="lfs-topbar-right">
    <button id="load" class="lfs-btn">
      <svg fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
      Load
    </button>
    <button id="export-btn" class="lfs-btn-ghost">
      Export Excel
    </button>
    <button id="export-all-btn" class="lfs-btn-ghost">
      <svg fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
        <path d="M19 14l-7 7m0 0l-7-7m7 7V3"></path><path d="M5 21h14"></path>
      </svg>
      Export All Examples
    </button>
  </div>
</header>

<!-- Stats + secondary actions -->
<div class="lfs-subbar">
  <div class="lfs-stats">
    <span class="lfs-stat-label">First side</span>
    <span class="lfs-stat-value banker">0</span>
    <span class="lfs-stat-divider"></span>
    <span class="lfs-stat-label">Second side</span>
    <span class="lfs-stat-value player">0</span>
    <span id="lfs-stat-triple" style="display:none">
      <span class="lfs-stat-divider"></span>
      <span class="lfs-stat-label">Triple</span>
      <span class="lfs-stat-value triple">0</span>
    </span>
  </div>
  <div class="lfs-subbar-actions">
    <button id="example-btn" class="lfs-btn-outline">
      <svg fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
      Example
    </button>
    <button id="example-btn2" class="lfs-btn-outline lfs-players-btn" onclick="openPopup('Player List', 'Please find below the formatted list of players who participated in the opposite gaming session')">
      <svg fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 1-4-4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      Players
      <span class="lfs-count player-list-count">0</span>
    </button>
  </div>
</div>

<!-- Brand chips -->
<div id="buttons" class="butoon-container"></div>

<!-- Data table -->
<div class="lfs-table-card">
  <table id="my-table" class="mytable" style="width:100%">
    <thead>
      <tr id="header-row"></tr>
    </thead>
    <tbody class="UserData"></tbody>
  </table>
</div>

<!-- Footer -->
<div class="lfs-footer">
  <span id="lfs-records">0 records · 0 rounds</span>
  <span id="lfs-date"></span>
</div>

<script type="text/javascript" src="js/tableau-extensions-1.0.0.min.js"></script>
<script type="text/javascript" src="https://code.jquery.com/jquery-3.6.0.js"></script>
<script type="text/javascript" src="js/application.js?v=29"></script>
<script src="https://cdn.datatables.net/1.13.2/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.4/js/dataTables.buttons.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script type="text/javascript" src="js/button.js"></script>

</body>
</html>
